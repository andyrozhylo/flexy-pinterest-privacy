<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flexy Planner website is coming soon.">
  <title>Flexy Planner | Coming Soon</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: #2d1835;
      background: radial-gradient(circle at 80% 8%, #f6deee 0, transparent 36%), #faf7f9;
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, footer { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    header { padding: 28px 0; }
    .brand { display: inline-flex; align-items: center; gap: 13px; color: inherit; text-decoration: none; font-weight: 760; font-size: 22px; letter-spacing: -.04em; }
    .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: #57245e; color: #fff; font-weight: 800; font-size: 24px; }
    main { flex: 1; display: grid; place-items: center; width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 90px 0 120px; }
    .content { max-width: 720px; text-align: center; }
    .eyebrow { display: inline-block; margin-bottom: 24px; padding: 7px 14px; border: 1px solid #e6cee3; border-radius: 999px; color: #763d77; background: #fff8fd; font-size: 13px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 22px; font-size: clamp(42px, 7vw, 82px); line-height: 1.04; letter-spacing: -.065em; }
    p { margin: 0 auto; max-width: 570px; color: #66576b; font-size: clamp(17px, 2vw, 20px); }
    .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin-top: 42px; }
    .links a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 11px 20px; border-radius: 12px; font-size: 15px; font-weight: 650; text-decoration: none; }
    .primary { color: #fff; background: #57245e; }
    .primary:hover { background: #713279; }
    .secondary { color: #57245e; border: 1px solid #dcc9dd; background: #fff; }
    .secondary:hover { background: #f8eef8; }
    footer { padding: 24px 0 30px; border-top: 1px solid #e9dfea; color: #86778a; font-size: 13px; text-align: center; }
    @media (max-width: 600px) { header, footer, main { width: min(100% - 36px, 1120px); } main { padding: 70px 0 110px; } .links { flex-direction: column; align-items: stretch; } }
  </style>
</head>
<body>
  <header><a class="brand" href="/"><span class="mark" aria-hidden="true">F</span>Flexy Planner</a></header>
  <main>
    <div class="content">
      <span class="eyebrow">Flexy Planner</span>
      <h1>Our website is coming soon.</h1>
      <p>We’re preparing a new home for Flexy. In the meantime, you can read the Privacy Policy for Flexy Visual Research Connector or contact us at <a href="mailto:a.rozhylo@gmail.com">a.rozhylo@gmail.com</a>.</p>
      <div class="links">
        <a class="primary" href="/privacy/">Privacy Policy</a>
        <a class="secondary" href="mailto:a.rozhylo@gmail.com">Contact us</a>
      </div>
    </div>
  </main>
  <footer>Flexy Planner</footer>
</body>
</html>
